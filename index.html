<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17151d"><meta name="description" content="NotasVA — suas ideias, do seu jeito.">
<title>NotasVA</title>
<style>
:root{--bg:#f4f1f8;--panel:#fff;--ink:#282431;--muted:#777181;--accent:#7957c8;--line:#e8e3ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;background:#f0ecf7;color:var(--ink)}button:active{transform:scale(.97)}button.primary{background:var(--accent);color:white}.app{height:100%;display:grid;grid-template-columns:260px 1fr}
.sidebar{background:#211e29;color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:14px;min-height:0}.brand{font-size:22px;font-weight:800;letter-spacing:.3px;padding:5px 8px}.brand span{color:#bda5ff}.new{background:#7957c8;color:white;text-align:left;font-weight:650}.side-label{font-size:11px;color:#aaa2b7;text-transform:uppercase;letter-spacing:1.2px;padding:8px}.notes{overflow:auto;display:flex;flex-direction:column;gap:5px}.note-item{background:transparent;color:#e8e3ef;text-align:left;padding:11px;border-radius:10px}.note-item.active,.note-item:hover{background:#393342}.note-item small{display:block;color:#aaa2b7;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;display:flex;flex-direction:column}.top{height:62px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px}.title-input{border:0;outline:0;font-size:18px;font-weight:700;min-width:0;flex:1;color:var(--ink);background:transparent}.save-status{font-size:12px;color:var(--muted);white-space:nowrap}.tools{background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tools button.active{background:#e5dcf8;color:#5637a2;outline:1px solid #cbb9f2}.tools input[type=color]{width:36px;height:36px;border:0;background:transparent;padding:2px}.tools input[type=range]{width:90px}.select{border:0;background:#f0ecf7;border-radius:9px;padding:9px;color:var(--ink)}.workspace{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start;background:#e9e5ee}.page{position:relative;width:min(850px,100%);min-height:100%;height:max(900px,calc(100% - 1px));background:#fff;box-shadow:0 5px 24px #28203920;border-radius:3px;overflow:hidden}.page.grid{background-image:linear-gradient(#d9d2e8 1px,transparent 1px),linear-gradient(90deg,#d9d2e8 1px,transparent 1px);background-size:26px 26px}.page.lines{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#dce5f3 32px)}.page.dots{background-image:radial-gradient(#cfc5df 1px,transparent 1px);background-size:22px 22px}.page.yellow{background-color:#fff9df}.page.dark{background-color:#25222c;color:#f7f3ff}.writing{position:absolute;inset:0;padding:34px 42px;outline:0;z-index:1;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:17px}.writing:empty:before{content:"Comece a escrever sua nota...";color:#aaa5b1;pointer-events:none}.page.dark .writing{color:#f7f3ff}.draw{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}.bottom{padding:8px 15px;color:var(--muted);font-size:12px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between}.mobile-menu{display:none}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:absolute;z-index:10;inset:0 auto 0 0;width:min(290px,85vw);box-shadow:10px 0 40px #0004}.mobile-menu{display:inline-block}.top{padding:0 10px;gap:7px}.save-status{display:none}.workspace{padding:10px}.page{min-height:850px}.writing{padding:25px 22px}.tools{gap:5px;padding:7px}.tools button{padding:8px 10px;font-size:13px}.tools input[type=range]{width:65px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">Notas<span>VA</span></div><button class="new" id="newNote">＋ &nbsp; Nova nota</button><div class="side-label">Minhas notas</div><div class="notes" id="notes"></div><div style="margin-top:auto;color:#aaa2b7;font-size:11px;padding:8px">Suas notas ficam salvas neste dispositivo.</div></aside>
<main class="main">
<header class="top"><button class="mobile-menu" id="menu">☰</button><input class="title-input" id="title" value="Minha nota" aria-label="Título da nota"><span class="save-status" id="status">Salvo</span><button id="delete">Excluir</button></header>
<section class="tools" aria-label="Ferramentas de escrita">
<button id="textTool" class="active" title="Escrever texto">T Texto</button><button id="pen" title="Caneta">✎ Caneta</button><button id="eraser" title="Borracha">⌫ Borracha</button><label title="Cor do traço"><input id="color" type="color" value="#292333"></label><label title="Espessura">↔ <input id="size" type="range" min="1" max="18" value="3"></label><select class="select" id="paper" aria-label="Fundo da página"><option value="plain">Papel branco</option><option value="lines"> pautado</option><option value="grid">Quadriculado</option><option value="dots">Pontilhado</option><option value="yellow">Creme</option><option value="dark">Escuro</option></select><button id="clear">Limpar desenho</button><button id="export">Exportar .txt</button>
</section>
<section class="workspace"><div class="page" id="page"><div class="writing" id="writing" contenteditable="true" spellcheck="true"></div><canvas class="draw" id="draw"></canvas></div></section>
<footer class="bottom"><span>NotasVA • Espaço para suas ideias</span><span id="count">0 caracteres</span></footer>
</main></div>
<script>
(()=>{
const $=id=>document.getElementById(id);let notes=[],current=null,mode='text',drawing=false,last=null;
try{notes=JSON.parse(localStorage.getItem('notasva-notes')||'[]')}catch(e){notes=[]}
function persist(){localStorage.setItem('notasva-notes',JSON.stringify(notes));$('status').textContent='Salvo';renderList()}
function blank(){return {id:Date.now().toString(),title:'Nova nota',text:'',paper:'plain',strokes:[]}}
function selectNote(n){current=n;$('title').value=n.title;$('writing').innerText=n.text;$('paper').value=n.paper||'plain';$('page').className='page '+(n.paper==='plain'?'':n.paper);redraw();updateCount();renderList()}
function saveCurrent(){if(!current)return;current.title=$('title').value.trim()||'Sem título';current.text=$('writing').innerText;current.paper=$('paper').value;persist()}
function renderList(){$('notes').innerHTML='';notes.slice().reverse().forEach(n=>{const b=document.createElement('button');b.className='note-item'+(current&&n.id===current.id?' active':'');b.innerHTML='<strong></strong><small></small>';b.querySelector('strong').textContent=n.title||'Sem título';b.querySelector('small').textContent=(n.text||'Nota vazia').slice(0,70);b.onclick=()=>{saveCurrent();selectNote(n)};$('notes').appendChild(b)})}
function makeNew(){saveCurrent();const n=blank();notes.push(n);selectNote(n);persist();$('writing').focus()}
$('newNote').onclick=makeNew;$('title').addEventListener('input',()=>{if(current){current.title=$('title').value;persist()}});$('writing').addEventListener('input',()=>{if(current){current.text=$('writing').innerText;persist();updateCount()}});$('paper').onchange=()=>{if(!current)return;current.paper=$('paper').value;$('page').className='page '+(current.paper==='plain'?'':current.paper);persist()};
function updateCount(){$('count').textContent=$('writing').innerText.length+' caracteres'}
const canvas=$('draw'),ctx=canvas.getContext('2d');
function resize(){const r=$('page').getBoundingClientRect(),dpr=window.devicePixelRatio||1;const old=current?.strokes||[];canvas.width=r.width*dpr;canvas.height=$('page').scrollHeight*dpr;canvas.style.height=$('page').scrollHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
function redraw(){if(!current)return;const dpr=window.devicePixelRatio||1;ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);(current.strokes||[]).forEach(s=>{if(s.points.length<2)return;ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.moveTo(...s.points[0]);s.points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke()})}
function point(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
canvas.addEventListener('pointerdown',e=>{if(mode==='text')return;drawing=true;canvas.setPointerCapture(e.pointerId);last=point(e);if(mode==='pen'){current.strokes.push({color:$('color').value,width=+$('size').value,points:[last]})}else{ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(last[0],last[1],+$('size').value*3,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';current.strokes=[];redraw()}});
canvas.addEventListener('pointermove',e=>{if(!drawing||mode==='text')return;const p=point(e);if(mode==='pen'){const s=current.strokes[current.strokes.length-1];s.points.push(p);ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke()}else{redraw();ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p[0],p[1],+$('size').value*3,0,Math.PI*2);ctx.fill();ctx.restore()}last=p});
function end(){if(drawing){drawing=false;if(current)persist()}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function setMode(m){mode=m;$('textTool').classList.toggle('active',m==='text');$('pen').classList.toggle('active',m==='pen');$('eraser').classList.toggle('active',m==='eraser');$('writing').contentEditable=m==='text';canvas.style.pointerEvents=m==='text'?'none':'auto'}
$('textTool').onclick=()=>setMode('text');$('pen').onclick=()=>setMode('pen');$('eraser').onclick=()=>setMode('eraser');
$('clear').onclick=()=>{if(!current)return;if(confirm('Apagar todos os traços desta nota?')){current.strokes=[];redraw();persist()}};
$('delete').onclick=()=>{if(!current||!confirm('Excluir esta nota?'))return;notes=notes.filter(n=>n.id!==current.id);if(!notes.length)notes.push(blank());selectNote(notes[notes.length-1]);persist()};
$('export').onclick=()=>{const blob=new Blob([$('title').value+'\n\n'+$('writing').innerText],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=($('title').value||'nota')+'.txt';a.click();URL.revokeObjectURL(a.href)};
$('menu').onclick=()=>$('sidebar').classList.toggle('open');
if(!notes.length)notes=[blank()];selectNote(notes[notes.length-1]);renderList();setMode('text');setTimeout(resize,80);window.addEventListener('resize',resize);
})();
</script></body></html>
