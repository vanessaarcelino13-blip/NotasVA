<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17151f">
<meta name="description" content="NotasVA — escreva, desenhe e organize suas ideias.">
<link rel="manifest" href="./manifest.webmanifest">
<title>NotasVA</title>
<style>
:root{color-scheme:light;--bg:#f4f2f7;--surface:#fff;--ink:#252230;--muted:#858091;--line:#e9e5ef;--accent:#7956cf;--accent2:#eee8fb;--dark:#211e2a;--shadow:0 12px 38px #21172b1c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{border:0;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #bda8f4;outline-offset:2px}.app{height:100dvh;display:flex;min-width:0}.sidebar{width:276px;background:var(--dark);color:white;padding:20px 14px;display:flex;flex-direction:column;gap:15px;flex-shrink:0;z-index:30}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px;padding:4px 9px 10px}.brand span{color:#c2aaff}.new{height:48px;text-align:left;padding:0 16px;border-radius:14px;background:var(--accent);color:white;font-weight:750;box-shadow:0 7px 18px #7956cf45}.side-heading{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#a8a1b4;padding:10px 9px 0}.notes{overflow:auto;display:flex;flex-direction:column;gap:5px}.note-item{background:transparent;color:#eeeaf5;text-align:left;border-radius:12px;padding:12px}.note-item.active,.note-item:active{background:#3a3447}.note-item strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-item small{display:block;color:#aaa3b5;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.side-foot{margin-top:auto;padding:10px;color:#aaa3b5;font-size:11px;line-height:1.5}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:66px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}.icon-btn{width:42px;height:42px;border-radius:13px;background:transparent;display:grid;place-items:center;font-size:20px}.icon-btn:hover,.soft-btn:hover{background:var(--accent2);color:var(--accent)}.title{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:18px;font-weight:750}.save{font-size:12px;color:var(--muted);white-space:nowrap}.top-actions{display:flex;gap:5px}.editor-area{flex:1;min-height:0;overflow:auto;padding:28px 22px 110px;background:#ece9f1;display:flex;justify-content:center;align-items:flex-start}.paper{position:relative;width:min(850px,100%);min-height:1050px;background:#fff;border-radius:5px;box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}.paper.grid{background-image:linear-gradient(#ddd6eb 1px,transparent 1px),linear-gradient(90deg,#ddd6eb 1px,transparent 1px);background-size:27px 27px}.paper.lines{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#dce5f3 34px)}.paper.dots{background-image:radial-gradient(#cfc5df 1px,transparent 1px);background-size:22px 22px}.paper.cream{background-color:#fff9e8}.paper.night{background-color:#292532;color:#f7f3ff}.writing{position:relative;z-index:2;min-height:1050px;padding:48px 58px;outline:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:17px;color:inherit;caret-color:var(--accent)}.writing:empty:before{content:"Comece a escrever sua nota...";color:#aaa5b1;pointer-events:none}.paper.night .writing{color:#f7f3ff}.draw{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none;pointer-events:none}.bottom-bar{height:45px;flex-shrink:0;background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:var(--muted);font-size:12px}.floating-tools{position:absolute;z-index:12;bottom:62px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:8px;background:#252230;color:white;border-radius:18px;box-shadow:0 12px 35px #18131f45}.tool-main{height:46px;min-width:48px;padding:0 13px;border-radius:13px;background:transparent;color:white;font-weight:650}.tool-main.active{background:#55417e;color:#fff}.tool-main .sym{font-size:19px;display:block}.tool-main small{font-size:10px;display:block}.tool-sep{height:30px;width:1px;background:#ffffff26}.popup{position:absolute;z-index:40;background:white;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:9px;min-width:210px;display:none}.popup.show{display:block}.popup button{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;background:white;text-align:left;font-size:14px}.popup button:active,.popup button:hover{background:var(--accent2)}.popup .danger{color:#c13c52}.tool-popup{bottom:119px;left:50%;transform:translateX(-50%);min-width:min(340px,calc(100vw - 28px))}.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tool-grid button{justify-content:center;flex-direction:column;gap:5px;background:#f7f5fa;padding:13px 6px}.tool-grid button span{font-size:20px}.tool-grid button.active{background:var(--accent2);color:var(--accent)}.tool-settings{padding:12px 5px 4px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}.tool-settings input[type=range]{flex:1;min-width:50px;accent-color:var(--accent)}.tool-settings input[type=color]{width:37px;height:34px;border:0;background:transparent;padding:0}.menu-popup{right:15px;top:58px}.paper-popup{bottom:118px;left:50%;transform:translateX(-50%)}.mobile-only{display:none}.shade{position:fixed;inset:0;background:#15111d66;z-index:25;display:none}.shade.show{display:block}.toast{position:absolute;z-index:60;bottom:125px;left:50%;transform:translateX(-50%);background:#252230;color:white;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-only{display:grid}.topbar{height:60px;padding:0 9px;gap:5px}.title{font-size:16px}.save{display:none}.top-actions{gap:0}.icon-btn{width:39px;height:39px}.editor-area{padding:12px 9px 100px}.paper{min-height:950px}.writing{padding:30px 23px;min-height:950px;font-size:16px}.floating-tools{bottom:56px;gap:2px;padding:6px;border-radius:16px;width:max-content;max-width:calc(100vw - 18px)}.tool-main{min-width:43px;padding:0 8px;height:44px}.tool-main small{font-size:9px}.bottom-bar{height:39px;padding:0 10px}.tool-popup{bottom:108px}.paper-popup{bottom:108px}.menu-popup{right:8px;top:55px}.shade{z-index:26}}
@media(min-width:761px){.sidebar{transform:none!important}.shade{display:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">Notas<span>VA</span></div><button class="new" id="newNote">＋ &nbsp; Nova nota</button><div class="side-heading">Minhas notas</div><div class="notes" id="notes"></div><div class="side-foot">Suas notas são salvas neste dispositivo.<br>NotasVA • Seu espaço criativo</div></aside>
<div class="shade" id="shade"></div>
<main class="main">
<header class="topbar">
<button class="icon-btn mobile-only" id="menuBtn" aria-label="Abrir notas">☰</button>
<input class="title" id="title" value="Minha nota" aria-label="Título da nota">
<span class="save" id="status">✓ Salvo</span>
<div class="top-actions"><button class="icon-btn" id="undoBtn" title="Desfazer último traço">↶</button><button class="icon-btn" id="moreBtn" title="Mais opções">⋯</button></div>
</header>
<section class="editor-area" id="editorArea"><div class="paper" id="paper"><div class="writing" id="writing" contenteditable="true" spellcheck="true"></div><canvas class="draw" id="draw"></canvas></div></section>
<footer class="bottom-bar"><span>NotasVA • Suas ideias em um só lugar</span><span id="count">0 caracteres</span></footer>
<div class="floating-tools">
<button class="tool-main active" id="textTool"><span class="sym">T</span><small>Texto</small></button>
<button class="tool-main" id="quickPen"><span class="sym">✎</span><small>Caneta</small></button>
<button class="tool-main" id="quickEraser"><span class="sym">⌫</span><small>Borracha</small></button>
<div class="tool-sep"></div>
<button class="tool-main" id="toolsBtn"><span class="sym">＋</span><small>Ferramentas</small></button>
<button class="tool-main" id="paperBtn"><span class="sym">▤</span><small>Papel</small></button>
</div>
<div class="popup tool-popup" id="toolsPopup">
<div class="tool-grid">
<button data-mode="text" class="active"><span>T</span>Texto</button><button data-mode="pen"><span>✎</span>Caneta</button><button data-mode="marker"><span>▰</span>Marca-texto</button><button data-mode="eraser"><span>⌫</span>Borracha</button><button id="clearDrawing"><span>⌧</span>Limpar traços</button><button id="insertDate"><span>▦</span>Inserir data</button>
</div>
<div class="tool-settings"><label for="inkColor">Cor</label><input type="color" id="inkColor" value="#292333"><label for="inkSize">Espessura</label><input type="range" id="inkSize" min="1" max="24" value="3"><span id="sizeLabel">3</span></div>
</div>
<div class="popup paper-popup" id="paperPopup">
<button data-paper="plain">▢ &nbsp; Papel branco</button><button data-paper="lines">☷ &nbsp; Pautado</button><button data-paper="grid">▦ &nbsp; Quadriculado</button><button data-paper="dots">⠿ &nbsp; Pontilhado</button><button data-paper="cream">▢ &nbsp; Creme</button><button data-paper="night">◐ &nbsp; Escuro</button>
</div>
<div class="popup menu-popup" id="menuPopup">
<button id="exportTxt">⇩ &nbsp; Exportar nota (.txt)</button><button id="exportPrint">▤ &nbsp; Imprimir / PDF</button><button id="duplicateNote">▣ &nbsp; Duplicar nota</button><button id="deleteNote" class="danger">⌫ &nbsp; Excluir nota</button>
</div>
<div class="toast" id="toast"></div>
</main>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const STORAGE='notasva-notes-v2';
let notes=[],current=null,mode='text',drawing=false,lastPoint=null,toastTimer=null;
try{const raw=JSON.parse(localStorage.getItem(STORAGE)||'null');if(Array.isArray(raw))notes=raw;else{const old=JSON.parse(localStorage.getItem('notasva-notes')||'[]');if(Array.isArray(old))notes=old}}catch(_){notes=[]}
function blank(){return{id:String(Date.now())+Math.random().toString(16).slice(2,6),title:'Nova nota',text:'',paper:'plain',strokes:[]}}
function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function closePopups(){document.querySelectorAll('.popup').forEach(p=>p.classList.remove('show'));$('toolsBtn').classList.remove('active');$('paperBtn').classList.remove('active')}
function save(){if(!current)return;current.title=$('title').value.trim()||'Sem título';current.text=$('writing').innerText;current.paper=current.paper||'plain';localStorage.setItem(STORAGE,JSON.stringify(notes));$('status').textContent='✓ Salvo';renderNotes()}
function renderNotes(){const host=$('notes');host.replaceChildren();notes.slice().reverse().forEach(n=>{const b=document.createElement('button');b.className='note-item'+(current&&n.id===current.id?' active':'');const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=n.title||'Sem título';small.textContent=(n.text||'Nota vazia').slice(0,65);b.append(strong,small);b.addEventListener('click',()=>{save();selectNote(n);closeSidebar()});host.appendChild(b)})}
function selectNote(n){current=n;$('title').value=n.title||'';$('writing').textContent=n.text||'';$('paper').className='paper '+(n.paper&&n.paper!=='plain'?n.paper:'');current.strokes=Array.isArray(n.strokes)?n.strokes:[];resizeCanvas();redraw();updateCount();renderNotes();setMode('text')}
function createNote(){save();const n=blank();notes.push(n);selectNote(n);save();$('writing').focus();closeSidebar();notify('Nova nota criada')}
function updateCount(){$('count').textContent=$('writing').innerText.length+' caracteres'}
function setMode(m){mode=m;$('writing').contentEditable=m==='text';$('draw').style.pointerEvents=m==='text'?'none':'auto';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));[['textTool','text'],['quickPen','pen'],['quickEraser','eraser']].forEach(([id,x])=>$(id).classList.toggle('active',m===x));if(m!=='text')$('writing').blur()}
function setPaper(p){if(!current)return;current.paper=p;$('paper').className='paper '+(p==='plain'?'':p);save();closePopups();notify('Papel atualizado')}
const canvas=$('draw'),ctx=canvas.getContext('2d');
function resizeCanvas(){const r=$('paper').getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1),h=Math.max($('paper').scrollHeight,950);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=r.width+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function redraw(){const dpr=Math.max(1,window.devicePixelRatio||1);ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);(current?.strokes||[]).forEach(s=>{if(!s.points||s.points.length<1)return;ctx.save();ctx.beginPath();ctx.strokeStyle=s.color||'#292333';ctx.lineWidth=s.width||3;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=s.alpha||1;ctx.moveTo(s.points[0][0],s.points[0][1]);s.points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));if(s.points.length===1){ctx.lineTo(s.points[0][0]+.1,s.points[0][1]+.1)}ctx.stroke();ctx.restore()})}
function pos(e){const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
canvas.addEventListener('pointerdown',e=>{if(mode==='text'||!current)return;e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);lastPoint=pos(e);const color=mode==='marker'?'#f5d85b':$('inkColor').value;current.strokes.push({color,width:mode==='marker'?Math.max(10,+$('inkSize').value*2):+$('inkSize').value,alpha:mode==='marker'?.35:1,points:[lastPoint]})});
canvas.addEventListener('pointermove',e=>{if(!drawing||!current)return;e.preventDefault();const p=pos(e),s=current.strokes[current.strokes.length-1];if(mode==='eraser'){const radius=+$('inkSize').value*2;current.strokes=current.strokes.filter(st=>!st.points.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<radius+st.width/2));redraw()}else{s.points.push(p);const dpr=Math.max(1,window.devicePixelRatio||1);ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.beginPath();ctx.strokeStyle=s.color;ctx.globalAlpha=s.alpha;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.moveTo(...lastPoint);ctx.lineTo(...p);ctx.stroke();ctx.restore()}lastPoint=p});
function endDraw(){if(!drawing)return;drawing=false;lastPoint=null;save()}
canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);canvas.addEventListener('lostpointercapture',endDraw);
$('writing').addEventListener('input',()=>{updateCount();$('status').textContent='Salvando…';save()});$('title').addEventListener('input',()=>{save()});
$('newNote').addEventListener('click',createNote);
$('menuBtn').addEventListener('click',()=>{$('sidebar').classList.add('open');$('shade').classList.add('show')});
function closeSidebar(){$('sidebar').classList.remove('open');$('shade').classList.remove('show')}
$('shade').addEventListener('click',closeSidebar);
$('textTool').addEventListener('click',()=>setMode('text'));$('quickPen').addEventListener('click',()=>setMode('pen'));$('quickEraser').addEventListener('click',()=>setMode('eraser'));
$('toolsBtn').addEventListener('click',()=>{const p=$('toolsPopup');const open=!p.classList.contains('show');closePopups();if(open){p.classList.add('show');$('toolsBtn').classList.add('active')}});
$('paperBtn').addEventListener('click',()=>{const p=$('paperPopup');const open=!p.classList.contains('show');closePopups();if(open){p.classList.add('show');$('paperBtn').classList.add('active')}});
$('moreBtn').addEventListener('click',()=>{const p=$('menuPopup');const open=!p.classList.contains('show');closePopups();if(open)p.classList.add('show')});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{setMode(b.dataset.mode);closePopups()}));
document.querySelectorAll('[data-paper]').forEach(b=>b.addEventListener('click',()=>setPaper(b.dataset.paper)));
$('inkColor').addEventListener('input',()=>{});$('inkSize').addEventListener('input',()=>{$('sizeLabel').textContent=$('inkSize').value});
$('clearDrawing').addEventListener('click',()=>{if(!current)return;if(confirm('Apagar todos os desenhos desta nota?')){current.strokes=[];redraw();save();notify('Desenhos removidos')}});
$('insertDate').addEventListener('click',()=>{const d=new Date().toLocaleDateString('pt-BR');$('writing').focus();document.execCommand('insertText',false,d+' — ');save();closePopups()});
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
$('exportTxt').addEventListener('click',()=>{save();download((current.title||'nota').replace(/[\\/:*?"<>|]/g,'_')+'.txt',new Blob([current.title+'\n\n'+current.text],{type:'text/plain;charset=utf-8'}));closePopups();notify('Nota exportada')});
$('exportPrint').addEventListener('click',()=>{closePopups();window.print()});
$('duplicateNote').addEventListener('click',()=>{const copy=JSON.parse(JSON.stringify(current));copy.id=String(Date.now());copy.title=(copy.title||'Nota')+' (cópia)';notes.push(copy);selectNote(copy);save();closePopups();notify('Nota duplicada')});
$('deleteNote').addEventListener('click',()=>{if(!current||!confirm('Excluir esta nota permanentemente?'))return;notes=notes.filter(n=>n.id!==current.id);if(!notes.length)notes.push(blank());selectNote(notes[notes.length-1]);save();closePopups();notify('Nota excluída')});
$('undoBtn').addEventListener('click',()=>{if(current?.strokes?.length){current.strokes.pop();redraw();save();notify('Último traço desfeito')}else notify('Não há traços para desfazer')});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.popup')&&!e.target.closest('#toolsBtn')&&!e.target.closest('#paperBtn')&&!e.target.closest('#moreBtn'))closePopups()});
window.addEventListener('resize',()=>{resizeCanvas();redraw()});
if(!notes.length)notes=[blank()];selectNote(notes[notes.length-1]);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
<style media="print">body{overflow:visible;background:white}.sidebar,.topbar,.bottom-bar,.floating-tools,.popup,.toast{display:none!important}.app,.main,.editor-area{height:auto;display:block;overflow:visible;padding:0;background:white}.paper{box-shadow:none;width:100%;min-height:100vh}.writing{min-height:100vh}</style>
</body></html>
