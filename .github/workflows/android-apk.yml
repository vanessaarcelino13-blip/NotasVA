name: Gerar APK do NotasVA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index.html.gz.b64'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar interface v4 enviada
        run: |
          if [ -f index.html.gz.b64 ]; then
            base64 -d index.html.gz.b64 | gzip -dc > index.html
            rm index.html.gz.b64
            sed -i "s/notasva-v2/notasva-v4/" sw.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html index.html.gz.b64 sw.js
            if ! git diff --cached --quiet; then
              git commit -m "Atualiza interface NotasVA v4.1"
              git push
            fi
          fi
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependências
        run: |
          npm install @capacitor/core@6.1.2 @capacitor/android@6.1.2
          npm install --save-dev @capacitor/cli@6.1.2
      - name: Preparar aplicativo
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NotasVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
