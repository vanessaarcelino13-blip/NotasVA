name: Gerar APK do NotasVA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notasva-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos do aplicativo
        run: npm run build

      - name: Criar projeto Android do Capacitor
        run: npx cap add android

      - name: Sincronizar aplicativo Android
        run: npx cap sync android

      - name: Compilar APK de depuração
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NotasVA-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NotasVA-APK
          path: NotasVA-debug.apk
          if-no-files-found: error
          retention-days: 30
